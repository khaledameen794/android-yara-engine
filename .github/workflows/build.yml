name: Build Android ARM64 C API

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new versioned GitHub Release after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-arm64-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: ""
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust target
        run: rustup toolchain install 1.97.1 --profile minimal --target aarch64-linux-android --no-self-update
      - name: Verify and prepare pinned inputs
        run: python3 scripts/bootstrap.py
      - name: Cross-compile C API
        run: bash scripts/build.sh
      - name: Preserve original license notices and seal checksums
        run: python3 scripts/notices.py
      - name: Verify ARM64 ELF and release manifest
        run: python3 scripts/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-capi
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify_artifact:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-arm64-capi
          path: dist
      - name: Check publish artifact without publishing
        run: python3 scripts/publish.py --check-only

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, verify_artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-arm64-capi
          path: dist
      - name: Publish verified assets using only the job-scoped token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
